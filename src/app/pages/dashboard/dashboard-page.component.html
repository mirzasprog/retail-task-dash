<section class="dashboard" *ngIf="kpis$ | async as kpis; else loading">
  <header>
    <h1>Store dashboard - {{ storeName }}</h1>
  </header>

  <div class="kpi-grid">
    <app-kpi-card *ngFor="let metric of kpis" [metric]="metric"></app-kpi-card>
  </div>

  <div class="grid">
    <app-task-list title="Današnji zadaci" [tasks]="(tasks$ | async) ?? []"></app-task-list>
    <app-trend-chart [sales]="(sales$ | async) ?? []"></app-trend-chart>
  </div>

  <app-sales-table [sales]="(sales$ | async) ?? []"></app-sales-table>
</section>

<ng-template #loading>
  <div class="loading">Učitavanje dashboarda...</div>
</ng-template>
