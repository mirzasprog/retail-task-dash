<section class="auth">
  <div class="auth__panel">
    <h2>Reset access</h2>
    <p>Enter your email to receive password reset instructions.</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@retaildash.com" />
      <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Valid email required</small>
      <button class="primary" type="submit">Send reset link</button>
      <a routerLink="/login" class="link">Back to login</a>
    </form>
    <div *ngIf="submitted" class="alert">We sent you a secure link. Please check your inbox.</div>
  </div>
  <div class="auth__hero">
    <p>Security-first infrastructure with automatic expirations.</p>
  </div>
</section>
