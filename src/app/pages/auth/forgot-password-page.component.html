<section class="auth">
  <div class="auth__panel">
    <div class="auth__language">
      <app-language-switcher></app-language-switcher>
    </div>
    <h2>{{ 'auth.forgot.title' | translate }}</h2>
    <p>{{ 'auth.forgot.subtitle' | translate }}</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>{{ 'auth.forgot.emailLabel' | translate }}</label>
      <input type="email" formControlName="email" placeholder="you@retaildash.com" />
      <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">{{ 'auth.forgot.emailError' | translate }}</small>
      <button class="primary" type="submit">{{ 'auth.forgot.submit' | translate }}</button>
      <a routerLink="/login" class="link">{{ 'auth.forgot.back' | translate }}</a>
    </form>
    <div *ngIf="submitted" class="alert">{{ 'auth.forgot.confirmation' | translate }}</div>
  </div>
  <div class="auth__hero">
    <p>{{ 'auth.hero' | translate }}</p>
  </div>
</section>
