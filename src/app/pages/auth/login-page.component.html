<section class="auth">
  <div class="auth__panel">
    <h2>Retail Task Dash</h2>
    <p>Prijavite se kako biste upravljali operacijama.</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@retaildash.com" />
      <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Valid email required</small>

      <label>Password</label>
      <input type="password" formControlName="password" placeholder="••••••••" />
      <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Password required</small>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button class="primary" type="submit">Prijava</button>
      <a routerLink="/forgot-password" class="link">Zaboravljena lozinka?</a>
    </form>
  </div>
  <div class="auth__hero">
    <p>Jedna platforma za KPI nadzor, zadatke i izvještavanje.</p>
  </div>
</section>
