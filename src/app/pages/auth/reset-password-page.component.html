<section class="auth">
  <div class="auth__panel">
    <div class="auth__language">
      <app-language-switcher></app-language-switcher>
    </div>
    <h2>{{ 'auth.reset.title' | translate }}</h2>
    <p>{{ 'auth.reset.subtitle' | translate }}</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>{{ 'auth.reset.passwordLabel' | translate }}</label>
      <input type="password" formControlName="password" placeholder="••••••••" />
      <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched">{{ 'auth.reset.passwordError' | translate }}</small>

      <label>{{ 'auth.reset.confirmLabel' | translate }}</label>
      <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
      <small *ngIf="form.value.password !== form.value.confirmPassword && form.get('confirmPassword')?.touched">{{ 'auth.reset.confirmError' | translate }}</small>

      <button class="primary" type="submit">{{ 'auth.reset.submit' | translate }}</button>
      <a routerLink="/login" class="link">{{ 'auth.reset.back' | translate }}</a>
    </form>
    <div *ngIf="completed" class="alert">{{ 'auth.reset.confirmation' | translate }}</div>
  </div>
  <div class="auth__hero">
    <p>{{ 'auth.hero' | translate }}</p>
  </div>
</section>
