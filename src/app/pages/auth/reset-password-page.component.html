<section class="auth">
  <div class="auth__panel">
    <h2>Create new password</h2>
    <p>Choose a strong passphrase for your Retail Task Dash account.</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>New password</label>
      <input type="password" formControlName="password" placeholder="••••••••" />
      <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        Minimum 8 characters
      </small>

      <label>Confirm password</label>
      <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
      <small *ngIf="form.value.password !== form.value.confirmPassword && form.get('confirmPassword')?.touched">
        Passwords must match
      </small>

      <button class="primary" type="submit">Reset password</button>
      <a routerLink="/login" class="link">Return to login</a>
    </form>
    <div *ngIf="completed" class="alert">Password updated. You can now sign in.</div>
  </div>
  <div class="auth__hero">
    <p>Single sign-on and zero trust ready.</p>
  </div>
</section>
