<div class="card">
  <div class="card-header">
    <h3 class="card-title">Category contribution</h3>
    <button class="outline">Download CSV</button>
  </div>
  <table class="table" *ngIf="sales.length; else emptyState">
    <thead>
      <tr>
        <th>Odjel</th>
        <th>Prodaja</th>
        <th>Target</th>
        <th>Varijanca</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let record of sales">
        <td>{{ record.department }}</td>
        <td>{{ record.sales | number:'1.0-0' }}</td>
        <td>{{ record.target | number:'1.0-0' }}</td>
        <td [class.positive]="record.variance >= 0" [class.negative]="record.variance < 0">
          {{ record.variance | number:'1.1-1' }}%
        </td>
      </tr>
    </tbody>
  </table>
  <ng-template #emptyState>
    <p class="empty">No sales data available.</p>
  </ng-template>
</div>
