<div class="card">
  <div class="card-header">
    <h3 class="card-title">Category contribution</h3>
    <button class="outline">Download CSV</button>
  </div>
  <table class="table" *ngIf="categories.length; else emptyState">
    <thead>
      <tr>
        <th>Category</th>
        <th>Sales</th>
        <th>Contribution</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories">
        <td>{{ category.category }}</td>
        <td>{{ category.sales | currency }}</td>
        <td>
          <div class="progress">
            <div class="progress__fill" [style.width.%]="category.percentage"></div>
          </div>
          {{ category.percentage }}%
        </td>
      </tr>
    </tbody>
  </table>
  <ng-template #emptyState>
    <p class="empty">No sales data available.</p>
  </ng-template>
</div>
