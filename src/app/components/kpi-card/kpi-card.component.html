<div class="card kpi">
  <div class="kpi__content">
    <div class="label">{{ metric.metric }}</div>
    <div class="value">{{ metric.value | number:'1.0-0' }}</div>
    <div class="trend" [ngClass]="metric.trend">
      <span class="material-icons">{{ metric.trend === 'up' ? 'arrow_upward' : 'arrow_downward' }}</span>
      {{ metric.change | number:'1.0-1' }}% vs yesterday
    </div>
  </div>
</div>
