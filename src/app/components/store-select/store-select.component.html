<label class="store-select">
  <span class="label">{{ 'dashboard.storeSelector.label' | translate }}</span>
  <select
    [ngModel]="selectedStoreId"
    (ngModelChange)="onSelect($event)"
  >
    <option [ngValue]="null" disabled>{{ 'dashboard.storeSelector.placeholder' | translate }}</option>
    <option *ngFor="let store of stores" [value]="store.id">
      {{ store.name }} • {{ store.location }}
    </option>
  </select>
</label>
